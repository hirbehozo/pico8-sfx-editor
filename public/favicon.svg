<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="3" fill="#1a1c2c"/>
  <!-- Two cycles of a sine wave in PICO-8 green -->
  <polyline
    fill="none"
    stroke="#00e436"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    points="
      1,16  3,10  5,6   7,10  9,16
      11,22 13,26 15,22 17,16
      19,10 21,6  23,10 25,16
      27,22 29,26 31,22
    "
  />
</svg>
